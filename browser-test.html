<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BRAiN Lab Diagnostics</title><style>body{background:#080808;color:#eee;font:16px system-ui;max-width:750px;margin:40px auto;padding:20px}li{padding:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#202020;padding:16px;border-radius:8px}a{color:#b49aff}</style></head><body><h1>BRAiN Lab startup diagnostics</h1><p>Read-only diagnostic. No participant information is accessed or uploaded.</p><ul id="checks"></ul><pre id="result">Running checks…</pre><p><a href="./">Return to calculator</a></p><script src="vendor/jszip.min.js"></script><script type="module">
const list=document.querySelector('#checks'),output=document.querySelector('#result');const log=(label,ok,detail='')=>{const li=document.createElement('li');li.textContent=(ok?'PASS':'FAIL')+' — '+label+(detail?' — '+detail:'');li.style.color=ok?'#7be3c6':'#ff8898';list.append(li)};
let failures=[];for(const path of ['scoring-data.json','app.js','scoring.js','excel.js','report.js','flanker-import.js','styles.css','brain-lab-logo.png','vendor/jszip.min.js']){try{const r=await fetch(path,{cache:'no-store'});log(path,r.ok,'HTTP '+r.status);if(!r.ok)failures.push(path+' HTTP '+r.status)}catch(e){log(path,false,e.message);failures.push(path+': '+e.message)}}
log('JSZip global',typeof window.JSZip==='function');if(typeof window.JSZip!=='function')failures.push('JSZip unavailable');
for(const path of ['scoring.js','excel.js','report.js','flanker-import.js']){try{await import('./'+path);log('Import '+path,true)}catch(e){log('Import '+path,false,e.message);failures.push('Import '+path+': '+e.stack)}}
try{const r=await fetch('scoring-data.json',{cache:'no-store'});if(r.ok){const data=await r.json();log('Scoring JSON parse',true);}}catch(e){log('Scoring JSON parse',false,e.message);failures.push('JSON: '+e.message)}
output.textContent=failures.length?'Diagnostics found '+failures.length+' issue(s):\n'+failures.join('\n\n'):'All dependency checks passed. If the home page still shows Loading, the error occurs during app initialization. Please send a screenshot of this page.';
</script></body></html>
